name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: slinventory.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t slinventory.azurecr.io/sl-inventory:${{ github.sha }} .
          docker push slinventory.azurecr.io/sl-inventory:${{ github.sha }}

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name ca-inventory \
            --resource-group rg-inventory \
            --image slinventory.azurecr.io/sl-inventory:${{ github.sha }}